#:schema https://mise.jdx.dev/schema/mise.json

[tools]
go = "1.27.3"
gotestsum = "1.13.0"

[tasks.psk]
description = "Generate a runtime PSK"
run = "openssl rand -hex 32"

[tasks.serve]
description = "Run the CLI locally"
usage = '''
flag "--vault <vault>" help="The 1Password vault to pick from" default="Personal"
flag "--item <item>" help="The 1password item to pick from" default="TickTick Events API Key"
flag "--pavlok-item <item>" help="The 1password item to pick from" default="pavlok-api-token"
flag "--field <field>" help="The 1Password item field to reveal" default="password"
flag "--pavlok-field <field>" help="The 1Password item field to reveal" default="password"
flag "--log-level <level>" help="Set the log level" default="info"
'''
run = '''
TICKTICK_TOKEN=$(op read "op://${usage_vault}/${usage_item}/${usage_field}")
export TICKTICK_TOKEN
PAVLOK_TOKEN=$(op read "op://${usage_vault}/${usage_pavlok_item}/${usage_pavlok_field}")
export PAVLOK_TOKEN
export RUNTIME_DB_URL="postgres://tick:tick@localhost:5432/tick?sslmode=disable"
export RUNTIME_HOST="$HOST"
export RUNTIME_PSK="$(mise run psk)"
export LOG_LEVEL="{{ usage.log_level }}"
export OTEL_EXPORTER_OTLP_ENDPOINT="http://localhost:4318"
go run main.go | jq
'''

[tasks.test]
description = "Run the test suite"
run = "gotestsum --format testname --packages './...'"
