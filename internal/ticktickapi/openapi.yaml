openapi: 3.0.3
info:
  title: TickTick Open API
  version: 1.0.0
paths:
  /open/v1/habit:
    get:
      operationId: ListHabits
      responses:
        '200':
          description: Habits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Habit'
  /open/v1/habit/{habitId}:
    get:
      operationId: GetHabit
      parameters:
        - name: habitId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Habit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Habit'
  /open/v1/habit/checkins:
    get:
      operationId: GetHabitCheckins
      parameters:
        - name: habitIds
          in: query
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: true
          schema:
            type: integer
        - name: to
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Habit check-ins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HabitCheckin'
  /open/v1/project/{projectId}/task/{taskId}:
    get:
      operationId: GetTask
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
  /open/v1/task/undone:
    post:
      operationId: ListUndoneTasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - startDate
                - endDate
              properties:
                startDate:
                  type: string
                endDate:
                  type: string
      responses:
        '200':
          description: Undone tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
components:
  schemas:
    Habit:
      type: object
      required:
        - id
        - name
        - status
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: integer
        repeatRule:
          type: string
        reminders:
          type: array
          items:
            type: string
        targetStartDate:
          type: integer
        createdTime:
          type: string
    HabitCheckin:
      type: object
      required:
        - habitId
        - checkins
      properties:
        habitId:
          type: string
        checkins:
          type: array
          items:
            $ref: '#/components/schemas/HabitCheckinData'
    HabitCheckinData:
      type: object
      required:
        - stamp
      properties:
        stamp:
          type: integer
        time:
          type: string
    ChecklistItem:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: integer
        completedTime:
          type: string
        isAllDay:
          type: boolean
        sortOrder:
          type: integer
          format: int64
        startDate:
          type: string
        timeZone:
          type: string
    Task:
      type: object
      required:
        - id
        - title
        - status
      properties:
        id:
          type: string
        projectId:
          type: string
        title:
          type: string
        content:
          type: string
        desc:
          type: string
        isAllDay:
          type: boolean
        startDate:
          type: string
        dueDate:
          type: string
        snoozeDate:
          type: string
        completedTime:
          type: string
        timeZone:
          type: string
        reminders:
          type: array
          items:
            type: string
        repeatFlag:
          type: string
        priority:
          type: integer
        sortOrder:
          type: integer
          format: int64
        kind:
          type: string
        etag:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistItem'
        tags:
          type: array
          items:
            type: string
        status:
          type: integer
